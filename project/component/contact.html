<section id="contact" class="py-5 bg-light">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h6 class="text-primary fw-bold text-uppercase mb-2">Get In Touch</h6>
            <h2 class="display-5 fw-bold text-dark">Contact Us</h2>
            <div class="mx-auto bg-primary" style="height: 3px; width: 60px;"></div>
        </div>

        <div class="row g-5">
            <div class="col-lg-5">
                <div class="bg-white p-4 rounded-4 shadow-sm h-100">
                    <h4 class="fw-bold mb-4">Contact Information</h4>

                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 50px; height: 50px;">
                            <i class="bi bi-geo-alt-fill fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-0 fw-bold">Location</h6>
                            <p class="text-secondary mb-0">Khurdha, Odisha, India</p>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 50px; height: 50px;">
                            <i class="bi bi-envelope-fill fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-0 fw-bold">Email Me</h6>
                            <p class="text-secondary mb-0">specify@example.com</p>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box bg-info-subtle text-info rounded-circle d-flex align-items-center justify-content-center"
                            style="width: 50px; height: 50px;">
                            <i class="bi bi-telephone-fill fs-4"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-0 fw-bold">Call Now</h6>
                            <p class="text-secondary mb-0">+91 8260537905</p>
                        </div>
                    </div>

                    <div class="mt-5">
                        <h6 class="fw-bold mb-3">Follow Us</h6>
                        <div class="d-flex gap-2">
                            <a href="#" class="btn btn-outline-primary btn-sm rounded-circle"><i
                                    class="bi bi-linkedin"></i></a>
                            <a href="#" class="btn btn-outline-dark btn-sm rounded-circle"><i
                                    class="bi bi-github"></i></a>
                            <a href="#" class="btn btn-outline-danger btn-sm rounded-circle"><i
                                    class="bi bi-instagram"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="bg-white p-4 rounded-4 shadow-sm">
                    <form id="contactForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Full Name</label>
                                <input type="text" class="form-control border-0 bg-light p-3"
                                    placeholder="Enter your name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Email Address</label>
                                <input type="email" class="form-control border-0 bg-light p-3"
                                    placeholder="Enter your email" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Subject</label>
                                <input type="text" class="form-control border-0 bg-light p-3"
                                    placeholder="Project Inquiry" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Message</label>
                                <textarea class="form-control border-0 bg-light p-3" rows="5"
                                    placeholder="How can I help you?" required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow">Send
                                    Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
